# GitHub Look —— 裸机部署的 Nginx 站点配置
# 放到 /etc/nginx/conf.d/github-look.conf 或 /etc/nginx/sites-available/ 下软链
# 注意：只监听 8188，不对外暴露后端 8080

server {
    listen 8188;
    server_name _;

    root /opt/github-look/frontend;
    index index.html;

    # Webhook 体积上限
    client_max_body_size 2m;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带指纹的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE
    # proxy_buffering off 是 SSE 能实时推送的前提，少了它前端会收不到事件
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查只在服务器本机可访问，不对外开放
    # curl http://127.0.0.1:8188/healthz
    location = /healthz {
        access_log off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }
}
